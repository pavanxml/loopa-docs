<text x="108" y="98" text-anchor="middle" font-weight="600">Browser</text><text x="108" y="117" text-anchor="middle" font-size="10" fill="#8b819b">React pages</text>
<text x="356" y="98" text-anchor="middle" font-weight="600" fill="#6d52b2">Next.js + API routes</text><text x="356" y="117" text-anchor="middle" font-size="10" fill="#8b819b">Validation · sessions · access</text>
<text x="634" y="98" text-anchor="middle" font-weight="600">SQLite</text><text x="634" y="117" text-anchor="middle" font-size="10" fill="#8b819b">Accounts · content · mail queue</text>
<text x="634" y="236" text-anchor="middle" font-weight="600">Private media</text><text x="634" y="257" text-anchor="middle" font-size="10" fill="#8b819b">Photos · videos · thumbnails</text><text x="634" y="278" text-anchor="middle" font-size="10" fill="#8b819b">Filesystem, outside public/</text>
<text x="347" y="233" text-anchor="middle" font-weight="600">Realtime bus</text><text x="347" y="254" text-anchor="middle" font-size="10" fill="#8b819b">In-process by default</text><text x="347" y="275" text-anchor="middle" font-size="10" fill="#8b819b">Optional Redis pub/sub</text>
<text x="450" y="345" text-anchor="middle" font-weight="600">Mail worker</text><text x="450" y="365" text-anchor="middle" font-size="10" fill="#8b819b">Separate process · same database</text>
