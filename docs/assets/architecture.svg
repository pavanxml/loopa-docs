<rect width="800" height="410" rx="14" fill="#fcfbff"/>
<g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#383346">
<text x="30" y="34" font-size="10" letter-spacing="2" fill="#81758f">ONE APPLICATION. CONNECTED SERVICES.</text>
<g fill="none" stroke="#b9aecb" stroke-width="1.4" marker-end="url(#arrow)"><path d="M186 103h70"/><path d="M456 103h82"/><path d="M356 134v44h-10v29"/><path d="M401 134v44h247v29"/><path d="M275 252H108V134"/><path d="M730 103h35v247H543"/><path d="M357 350H238"/></g>
