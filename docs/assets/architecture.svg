<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">LOOPA request and service architecture</title><desc id="desc">Browser connects to Next.js API routes. Routes use SQLite, private media, and the realtime bus. The realtime bus sends SSE back to browsers and optionally uses Redis. A separate mail worker reads SQLite and sends email through SMTP.</desc>
