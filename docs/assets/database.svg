<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Core LOOPA data relationships</title><desc id="desc">Users have profiles, author posts, own uploads, join communities, and participate in conversations. Posts have media and comments. Communities have members and events. Events have attendees. Conversations have members and messages. This is a conceptual subset of the runtime schema.</desc>
